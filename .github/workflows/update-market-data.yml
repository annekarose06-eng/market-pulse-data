name: Update Market Pulse

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1-5"
      timezone: "Australia/Sydney"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build market snapshot
        run: python scripts/update_market_data.py

      - name: Commit updated snapshot
        run: |
          git config user.name "market-pulse-bot"
          git config user.email "market-pulse-bot@users.noreply.github.com"
          git add market_data.json market_history.json
          if git diff --cached --quiet; then
            echo "No market-data changes to commit."
          else
            git commit -m "Update daily market pulse"
            git push
          fi
